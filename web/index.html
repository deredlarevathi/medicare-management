<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediCare – Hospital Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <h1>MediCare</h1>
  <p class="tag">Hospital management</p>
  <nav>
    <button data-view="overview" class="active">Today <span id="c-today" class="badge">0</span></button>
    <button data-view="patients">Patients <span id="c-patients" class="badge">0</span></button>
    <button data-view="doctors">Doctors <span id="c-doctors" class="badge">0</span></button>
    <button data-view="appointments">Appointments <span id="c-appts" class="badge">0</span></button>
    <button data-view="billing" class="no-doctor">Billing <span id="c-bills" class="badge">0</span></button>
  </nav>
  <div class="who">
    <strong id="who-name"></strong>
    <span id="who-role"></span>
    <button id="logout" class="signout">Sign out</button>
  </div>
</aside>

<main>
  <div id="msg" class="msg" role="status" hidden></div>

  <section id="view-overview" class="view">
    <h2>Today’s schedule</h2>
    <table><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th></tr></thead>
    <tbody id="t-today"></tbody></table>
  </section>

  <section id="view-patients" class="view" hidden>
    <h2>Patients</h2>
    <form id="f-patient" class="row no-doctor">
      <input name="name" placeholder="Full name" required>
      <input name="age" type="number" min="0" max="120" placeholder="Age" required>
      <select name="gender" required>
        <option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option>
      </select>
      <input name="phone" placeholder="Phone" pattern="[0-9]{10}" title="10 digit phone number" required>
      <input name="address" placeholder="Address">
      <button class="primary">Register patient</button>
    </form>
    <table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Address</th><th></th></tr></thead>
    <tbody id="t-patients"></tbody></table>
  </section>

  <section id="view-doctors" class="view" hidden>
    <h2>Doctors</h2>
    <form id="f-doctor" class="row no-doctor">
      <input name="name" placeholder="Doctor name" required>
      <input name="specialization" placeholder="Specialization" required>
      <input name="phone" placeholder="Phone" pattern="[0-9]{10}" title="10 digit phone number" required>
      <button class="primary">Add doctor</button>
    </form>
    <table><thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th></th></tr></thead>
    <tbody id="t-doctors"></tbody></table>
  </section>

  <section id="view-appointments" class="view" hidden>
    <h2>Appointments</h2>
    <form id="f-appt" class="row">
      <select name="patientId" id="s-patient" required></select>
      <select name="doctorId" id="s-doctor" required></select>
      <input name="date" type="date" required>
      <input name="time" type="time" required>
      <button class="primary">Book appointment</button>
    </form>
    <table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th></th></tr></thead>
    <tbody id="t-appts"></tbody></table>
  </section>

  <section id="view-billing" class="view" hidden>
    <h2>Billing</h2>
    <div class="summary">
      <div><span>Collected</span><strong id="sum-paid">₹0.00</strong></div>
      <div><span>Pending</span><strong id="sum-due">₹0.00</strong></div>
    </div>
    <form id="f-bill" class="row">
      <select name="patientId" id="s-bill-patient" required></select>
      <input name="consultation" type="number" min="0" step="0.01" placeholder="Consultation fee" required>
      <input name="medicine" type="number" min="0" step="0.01" placeholder="Medicine charges">
      <input name="other" type="number" min="0" step="0.01" placeholder="Other charges">
      <button class="primary">Generate bill</button>
    </form>
    <table><thead><tr><th>Bill</th><th>Date</th><th>Patient</th><th>Consult</th><th>Medicine</th><th>Other</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody id="t-bills"></tbody></table>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
